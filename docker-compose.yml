services:
  postgres:
    image: postgres:16-alpine
    container_name: contract-tracker-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=contract_tracker
    volumes:
      - contract-tracker-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: contract-tracker-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=contract_tracker
      # Optional LINE Notify push - leave unset to disable
      - LINE_CHANNEL_ACCESS_TOKEN=
      - LINE_TARGET_ID=
      # Email alert via Gmail SMTP - fill in SMTP_USER/SMTP_PASS/ALERT_EMAIL_TO to enable
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=
      - ALERT_EMAIL_TO=
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:4000
    container_name: contract-tracker-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  contract-tracker-pgdata:
