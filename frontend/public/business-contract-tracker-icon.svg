<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B3D91"/>
      <stop offset="55%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#29B6F6"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F6FB"/>
    </linearGradient>
  </defs>

  <!-- background circle: fully contained in 640x640 viewBox -->
  <circle cx="320" cy="320" r="300" fill="#FFFFFF"/>
  <circle cx="320" cy="320" r="300" fill="none" stroke="#0B3D91" stroke-width="6" opacity="0.08"/>

  <!-- Shield shape -->
  <path d="M320 90
           L460 145
           L460 320
           C460 420 400 483 320 522
           C240 483 180 420 180 320
           L180 145
           Z"
        fill="url(#shieldGrad)"/>

  <!-- inner document card -->
  <g>
    <rect x="240" y="185" width="160" height="215" rx="14" fill="url(#paperGrad)"/>
    <!-- document lines -->
    <rect x="262" y="215" width="116" height="11" rx="5.5" fill="#1565C0" opacity="0.85"/>
    <rect x="262" y="241" width="90" height="9" rx="4.5" fill="#90A4AE" opacity="0.6"/>
    <rect x="262" y="261" width="98" height="9" rx="4.5" fill="#90A4AE" opacity="0.6"/>
    <rect x="262" y="281" width="70" height="9" rx="4.5" fill="#90A4AE" opacity="0.6"/>

    <!-- signature line -->
    <path d="M262 328 Q 280 315 298 328 T 332 328" stroke="#D32F2F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="262" y="342" width="62" height="6" rx="3" fill="#D32F2F" opacity="0.5"/>
  </g>

  <!-- red accent seal / checkmark badge -->
  <g>
    <circle cx="400" cy="385" r="48" fill="#D32F2F"/>
    <circle cx="400" cy="385" r="48" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M380 386 L394 400 L422 370" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
