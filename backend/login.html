<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ Contract Tracker</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#eef3fa;color:#18243b;display:grid;place-items:center;min-height:100vh;margin:0}main{background:white;border:1px solid #cbd5e1;border-radius:16px;padding:32px;width:min(380px,calc(100vw - 80px));box-shadow:0 16px 48px #233c6414}h1{font-size:24px;margin:0 0 24px}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #94a3b8;border-radius:8px}button{background:#233c64;color:white;cursor:pointer}button:disabled{opacity:.6}#message{white-space:pre-wrap}a{color:#1d4ed8}</style>
<main><h1>Contract Tracker</h1><form id="login"><label>ชื่อผู้ใช้<input name="username" autocomplete="username" required maxlength="100"></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>เข้าสู่ระบบ</button></form><p id="message" role="status"></p><button id="logout" hidden>ออกจากระบบ</button></main>
<script>
const form=document.querySelector('form'),message=document.querySelector('#message'),logout=document.querySelector('#logout');
async function session(){const r=await fetch('/api/auth/me',{credentials:'include'});if(r.ok){const {user}=await r.json();form.hidden=true;logout.hidden=false;message.textContent=`เข้าสู่ระบบแล้ว: ${user.username} (${user.role})\nกลับไปเปิดหรือรีเฟรชหน้าแอปได้เลย`;}}
form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await r.json();if(!r.ok)throw Error(data.error);form.reset();await session();}catch(err){message.textContent=err.message;}finally{button.disabled=false;}});
logout.addEventListener('click',async()=>{const r=await fetch('/api/auth/logout',{method:'POST',credentials:'include'});if(r.ok)location.reload();else message.textContent='ออกจากระบบไม่สำเร็จ กรุณาลองอีกครั้ง';});session().catch(()=>{message.textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ';});
</script></html>
